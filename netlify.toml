[build]
  command = "npm ci"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  NETLIFY = "true"
  DISABLE_AUTOMATION_SCHEDULER = "true"

[functions.api]
  node_bundler = "esbuild"
  external_node_modules = ["@neondatabase/serverless", "bufferutil", "utf-8-validate", "ws"]

[functions."automations-cron"]
  node_bundler = "esbuild"
  external_node_modules = ["@neondatabase/serverless", "ws"]

# Home Assistant asset paths that sometimes escape our HTML rewriter / SW.
[[redirects]]
  from = "/homeassistant/*"
  to = "/.netlify/functions/api/ha/static/homeassistant/:splat"
  status = 200

[[redirects]]
  from = "/local/*"
  to = "/.netlify/functions/api/ha/static/local/:splat"
  status = 200

[[redirects]]
  from = "/hacsfiles/*"
  to = "/.netlify/functions/api/ha/static/hacsfiles/:splat"
  status = 200

[[redirects]]
  from = "/frontend_latest/*"
  to = "/.netlify/functions/api/ha/static/frontend_latest/:splat"
  status = 200

[[redirects]]
  from = "/sw-modern.js"
  to = "/.netlify/functions/api/ha/static/sw-modern.js"
  status = 200

[[redirects]]
  from = "/service_worker.js"
  to = "/.netlify/functions/api/ha/static/service_worker.js"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/.netlify/functions/api/ha/static/manifest.json"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/dashboard-conex/*"
  to = "/.netlify/functions/api/ha/dashboard?dashboard=dashboard-conex&view=:splat"
  status = 200

[[redirects]]
  from = "/lovelace/*"
  to = "/.netlify/functions/api/ha/dashboard?dashboard=lovelace&view=:splat"
  status = 200

[[redirects]]
  from = "/ha-proxy-sw.js"
  to = "/.netlify/functions/api/ha-proxy-sw.js"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/api/ha-auth/:splat"
  status = 200
